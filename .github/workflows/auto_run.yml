name: OpenClaw 24/7 Auto Run

on:
  schedule:
    # Chạy tự động mỗi 6 tiếng một lần
    - cron: '0 */6 * * *'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên web khi cần

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy code từ GitHub
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cài đặt các thư viện
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Chạy Bot OpenClaw
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python main.py