name: OpenClaw Football Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Chạy tự động mỗi 6 tiếng

jobs:
  run-openclaw:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai cohere

      - name: Run OpenClaw Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
          GROQ_API: ${{ secrets.GROQ_API }}
          COHERE_API: ${{ secrets.COHERE_API }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python main.py